<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="MOINdocs">
<meta name="theme-color" content="#145a32">
<title>MOINdocs</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:ital,wght@0,400;0,500;0,600;0,700;0,800;1,400&family=Syne:wght@700;800&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://unpkg.com/pdf-lib@1.17.1/dist/pdf-lib.min.js"></script>
<script src="https://unpkg.com/vue@3/dist/vue.global.prod.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
<style>
/* ══════════════════════════════════════════════
   MOINDOCS — PREMIUM DESIGN SYSTEM v3
══════════════════════════════════════════════ */

/* ── TOKENS ── */
:root {
  /* Brand greens */
  --g50:#f2faf5; --g100:#daf0e4; --g200:#a8d9bc; --g300:#5cb87a;
  --g400:#2da05a; --g500:#1e8448; --g600:#166839; --g700:#0f4f2b;
  --g800:#093820; --g900:#051f12;
  /* Surfaces */
  --bg:#f5f7f6; --bg2:#eaeeed;
  --surf:#ffffff; --surf2:#f8faf9; --surf3:#edf4ef;
  /* Borders */
  --bdr:#dde8e2; --bdr2:#b8d4c4;
  /* Text */
  --txt:#111a15; --txt2:#2c4a36; --muted:#6a8c75; --muted2:#96b0a0;
  /* Accent */
  --gold:#a07820; --gold-bg:#fdf8ec;
  /* States */
  --red:#d42020; --red-bg:#fef1f1; --red-lt:#fca5a5;
  --amber:#c47a00; --amber-bg:#fffaeb;
  --blue:#1a50d0; --blue-bg:#eff4ff;
  --purple:#6d28c8;
  /* Radii */
  --r-sm:8px; --r-md:12px; --r-lg:16px; --r-xl:22px;
  /* Shadows */
  --sh-xs:0 1px 3px rgba(9,56,32,.06);
  --sh-sm:0 2px 8px rgba(9,56,32,.08),0 1px 2px rgba(9,56,32,.05);
  --sh-md:0 4px 16px rgba(9,56,32,.1),0 2px 6px rgba(9,56,32,.06);
  --sh-lg:0 10px 36px rgba(9,56,32,.14),0 4px 10px rgba(9,56,32,.08);
  /* Layout */
  --hh:56px; --nav:62px;
  /* Motion */
  --ease:.16s cubic-bezier(.4,0,.2,1);
  --ease-spring:.22s cubic-bezier(.34,1.56,.64,1);
}

/* ── BASE ── */
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
html{height:100%;-webkit-font-smoothing:antialiased;}
body{font-family:'Plus Jakarta Sans',sans-serif;background:var(--bg);
  color:var(--txt);font-size:14px;height:100%;overflow:hidden;line-height:1.5;}
::-webkit-scrollbar{width:3px;height:3px;}
::-webkit-scrollbar-thumb{background:var(--g200);border-radius:99px;}

/* ── HEADER ── */
.hdr{position:fixed;inset:0 0 auto;height:var(--hh);z-index:300;
  background:var(--g800);display:flex;align-items:center;padding:0 12px;gap:0;
  box-shadow:0 1px 0 rgba(255,255,255,.05),0 2px 16px rgba(0,0,0,.28);}
.hdr-menu{flex-shrink:0;width:36px;height:36px;border:none;background:none;
  color:rgba(255,255,255,.65);border-radius:9px;display:flex;align-items:center;
  justify-content:center;cursor:pointer;transition:background var(--ease);margin-right:6px;}
.hdr-menu:active{background:rgba(255,255,255,.12);}
.hdr-logo{display:flex;align-items:center;gap:9px;flex:1;min-width:0;overflow:hidden;}
.lico{width:30px;height:30px;flex-shrink:0;background:var(--g500);border-radius:8px;
  display:flex;align-items:center;justify-content:center;font-weight:800;font-size:.82rem;
  color:#fff;font-family:'Syne',sans-serif;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.15),0 2px 6px rgba(0,0,0,.25);}
.hdr-brand{display:flex;flex-direction:column;min-width:0;overflow:hidden;}
.hdr-brand-name{font-family:'Syne',sans-serif;font-weight:800;font-size:.96rem;
  color:#fff;letter-spacing:.01em;line-height:1.15;white-space:nowrap;}
.hdr-brand-name em{color:var(--g300);font-style:normal;}
.hdr-sub{font-size:.55rem;font-weight:600;color:rgba(255,255,255,.36);
  font-family:'Plus Jakarta Sans',sans-serif;overflow:hidden;text-overflow:ellipsis;
  white-space:nowrap;margin-top:1px;}
.hdr-actions{display:flex;align-items:center;gap:5px;flex-shrink:0;margin-left:8px;}
.save-dot-wrap{width:22px;height:22px;display:flex;align-items:center;justify-content:center;}
.save-dot{width:7px;height:7px;border-radius:50%;transition:background var(--ease);}
.save-dot.local{background:#fbbf24;}
.save-dot.saving{background:#60a5fa;animation:blink .8s ease-in-out infinite;}
.save-dot.cloud{background:#34d399;}
.save-dot.error{background:#f87171;}
@keyframes blink{0%,100%{opacity:1;}50%{opacity:.3;}}
.hdr-new{display:flex;align-items:center;gap:5px;background:var(--g500);border:none;
  color:#fff;border-radius:8px;padding:7px 11px;font-family:'Plus Jakarta Sans',sans-serif;
  font-size:.71rem;font-weight:700;letter-spacing:.02em;cursor:pointer;white-space:nowrap;
  box-shadow:0 2px 6px rgba(0,0,0,.2);transition:all var(--ease);}
.hdr-new:active{background:var(--g600);transform:scale(.96);}
.hdr-new-label{letter-spacing:.02em;}
.auth-user{display:flex;align-items:center;cursor:pointer;border-radius:50%;
  transition:opacity var(--ease);}
.auth-user:active{opacity:.65;}
.auth-avatar{width:28px;height:28px;border-radius:50%;border:2px solid rgba(255,255,255,.25);
  display:block;flex-shrink:0;}
.auth-avatar-init{background:var(--g400);display:flex;align-items:center;
  justify-content:center;font-size:.66rem;font-weight:800;color:#fff;
  font-family:'Syne',sans-serif;}
@keyframes rotateit{to{transform:rotate(360deg);}}
.hdr-sync{width:30px;height:30px;border:none;background:none;
  color:rgba(255,255,255,.6);border-radius:7px;display:flex;align-items:center;
  justify-content:center;cursor:pointer;font-size:.85rem;transition:all var(--ease);}
.hdr-sync.spin{animation:rotateit .65s linear infinite;}

/* Desktop header tweaks */
@media(min-width:700px){
  .hdr{padding:0 22px;height:60px;}
  :root{--hh:60px;}
  .hdr-menu{display:none !important;}
  .hdr-new-label::before{content:'New Customer';}
  .hdr-new svg{display:none;}
  .hdr-actions{gap:8px;}
}

/* ── BOTTOM NAV ── */
.bot-nav{position:fixed;inset:auto 0 0;height:var(--nav);z-index:300;
  background:var(--g800);display:flex;
  box-shadow:0 -1px 0 rgba(255,255,255,.05),0 -2px 16px rgba(0,0,0,.22);
  padding-bottom:env(safe-area-inset-bottom,0);}
.bnb{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:3px;border:none;background:none;color:rgba(255,255,255,.32);cursor:pointer;
  font-size:.46rem;font-weight:700;letter-spacing:.08em;text-transform:uppercase;
  padding:6px 2px;transition:color var(--ease);position:relative;}
.bnb .ico{font-size:1.18rem;line-height:1;transition:transform var(--ease-spring);}
.bnb.active{color:#fff;}
.bnb.active .ico{transform:translateY(-2px);}
.bnb.active::after{content:'';position:absolute;bottom:6px;left:50%;
  transform:translateX(-50%);width:4px;height:4px;border-radius:50%;
  background:var(--g300);box-shadow:0 0 5px var(--g300);}
@media(min-width:700px){.bot-nav{display:none !important;}}

/* ── LAYOUT ── */
.layout{display:flex;height:100vh;padding-top:var(--hh);padding-bottom:var(--nav);}
@media(min-width:700px){.layout{padding-bottom:0;}}

/* ── SIDEBAR ── */
.sidebar{width:268px;min-width:268px;background:var(--surf);
  border-right:1px solid var(--bdr);padding:14px 10px;
  display:flex;flex-direction:column;height:100%;}
.sec-ttl{font-family:'Syne',sans-serif;font-size:.55rem;font-weight:800;
  letter-spacing:.22em;text-transform:uppercase;color:var(--muted2);
  margin-bottom:10px;padding-bottom:7px;border-bottom:1px solid var(--bdr);
  display:flex;align-items:center;justify-content:space-between;}

/* Mobile sidebar */
@media(max-width:699px){
  .sidebar{display:none;position:fixed;top:var(--hh);left:0;
    bottom:var(--nav);width:82vw;max-width:285px;z-index:260;
    box-shadow:4px 0 24px rgba(0,0,0,.18);}
  .sidebar.open{display:flex;}
  .hdr-menu{display:flex;}
}

/* ── MAIN ── */
.main{flex:1;overflow-y:auto;overflow-x:hidden;
  padding:14px 12px calc(var(--nav) + 20px);height:100%;min-width:0;}
@media(min-width:700px){.main{padding:18px 24px 24px;}}
@media(min-width:1100px){.main{padding:22px 36px 28px;}}
.main-inner{max-width:680px;}
@media(min-width:700px){.main-inner{margin:0 auto;}}
@media(min-width:1100px){.main-inner{max-width:740px;}}

/* ── SIDEBAR OVERLAY ── */
.sb-ov{display:none;position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:250;}
.sb-ov.open{display:block;}
@media(min-width:700px){.sb-ov{display:none !important;}}

/* ── CARDS ── */
.card{background:var(--surf);border:1px solid var(--bdr);border-radius:var(--r-lg);
  padding:16px;margin-bottom:11px;box-shadow:var(--sh-sm);
  transition:box-shadow var(--ease);}
@media(min-width:700px){.card{border-radius:18px;padding:20px;margin-bottom:14px;}}
.card-ttl{font-family:'Syne',sans-serif;font-size:.62rem;font-weight:800;
  letter-spacing:.14em;text-transform:uppercase;color:var(--g600);
  margin-bottom:14px;padding-bottom:10px;border-bottom:1px solid var(--bdr);
  display:flex;align-items:center;gap:8px;}
.card-ttl .ti{width:26px;height:26px;flex-shrink:0;border-radius:7px;
  background:linear-gradient(135deg,var(--g100),var(--surf3));
  border:1px solid var(--bdr);display:flex;align-items:center;justify-content:center;
  font-size:.84rem;}

/* ── TABS (desktop only) ── */
.tab-bar{display:flex;gap:3px;margin-bottom:14px;
  background:var(--surf);border:1px solid var(--bdr);
  border-radius:14px;padding:4px;box-shadow:var(--sh-xs);}
.tab-btn{flex:1;padding:8px 4px;border-radius:10px;border:none;
  background:transparent;color:var(--muted);font-family:'Plus Jakarta Sans',sans-serif;
  font-size:.64rem;font-weight:700;cursor:pointer;transition:all var(--ease);
  text-align:center;line-height:1.3;letter-spacing:.01em;}
.tab-btn.active{background:var(--g700);color:#fff;
  box-shadow:0 2px 8px rgba(9,56,32,.28);}
.tab-pane{display:none;}
.tab-pane.active{display:block;}
@media(max-width:699px){.tab-bar{display:none;}}

/* ── FORM ── */
.fg{display:flex;flex-direction:column;gap:5px;margin-bottom:12px;}
.fg:last-child{margin-bottom:0;}
label{font-size:.58rem;color:var(--muted);font-weight:700;
  letter-spacing:.07em;text-transform:uppercase;
  display:flex;align-items:center;gap:5px;}
input,select,textarea{
  background:var(--surf2);border:1.5px solid var(--bdr);border-radius:9px;
  color:var(--txt);font-family:'Plus Jakarta Sans',sans-serif;
  font-size:.875rem;font-weight:600;padding:10px 12px;width:100%;
  -webkit-appearance:none;appearance:none;min-width:0;
  transition:border-color var(--ease),box-shadow var(--ease),background var(--ease);}
input:focus,select:focus,textarea:focus{
  outline:none;border-color:var(--g400);background:var(--surf);
  box-shadow:0 0 0 3px rgba(45,160,90,.13);}
input[readonly]{color:var(--muted);cursor:default;
  background:var(--bg2);border-color:var(--bdr);}
input[type=date]{color-scheme:light;}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
.row3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;}
@media(max-width:699px){
  .row3{grid-template-columns:1fr 1fr;}
  .row3 .span-full{grid-column:1/-1;}
}

/* ── AUTOCOMPLETE ── */
.ac-wrap{position:relative;}
.ac-drop{position:absolute;top:calc(100% + 5px);left:0;right:0;z-index:500;
  background:var(--surf);border:1.5px solid var(--g400);border-radius:12px;
  max-height:210px;overflow-y:auto;display:none;box-shadow:var(--sh-lg);}
.ac-drop.open{display:block;}
.ac-item{padding:10px 13px;font-size:.82rem;font-weight:600;cursor:pointer;
  border-bottom:1px solid var(--bdr);transition:background var(--ease);}
.ac-item:last-child{border-bottom:none;}
.ac-item:active,.ac-item:hover{background:var(--g50);color:var(--g700);}
.ac-sub{font-size:.62rem;color:var(--muted);margin-top:2px;}
.ac-used{pointer-events:none;opacity:.55;}
.ac-used-tag{font-size:.57rem;color:var(--red);font-weight:700;margin-left:5px;
  background:var(--red-bg);padding:1px 5px;border-radius:4px;}

/* ── BUTTONS ── */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:5px;
  padding:10px 16px;border-radius:9px;border:1.5px solid transparent;
  font-family:'Plus Jakarta Sans',sans-serif;font-size:.81rem;font-weight:700;
  cursor:pointer;transition:all var(--ease);white-space:nowrap;letter-spacing:.01em;}
.btn-primary{background:var(--g600);color:#fff;
  box-shadow:0 2px 8px rgba(22,104,57,.3);}
.btn-primary:active{background:var(--g700);transform:scale(.97);}
.btn-outline{background:transparent;color:var(--g600);border-color:var(--g300);}
.btn-outline:active{background:var(--g50);}
.btn-ghost{background:transparent;color:var(--txt2);border-color:var(--bdr);}
.btn-ghost:active{background:var(--bg2);}
.btn-danger{background:var(--red-bg);color:var(--red);border-color:var(--red-lt);}
.btn-danger:active{background:#fde8e8;}
.btn-sm{padding:7px 12px;font-size:.72rem;border-radius:8px;}
.btn-xs{padding:4px 8px;font-size:.66rem;border-radius:6px;}
.btn-full{width:100%;}

/* ── CUSTOMER LIST ── */
.ci{background:var(--surf);border:1px solid var(--bdr);border-radius:10px;
  padding:10px 11px;cursor:pointer;transition:all var(--ease);
  display:flex;align-items:center;justify-content:space-between;margin-bottom:5px;}
.ci.active,.ci:active{border-color:var(--g400);background:var(--g50);
  box-shadow:0 2px 10px rgba(45,160,90,.1);}
.ci-name{font-weight:700;font-size:.81rem;}
.ci-meta{color:var(--muted);font-size:.63rem;margin-top:2px;}
.ci-del{background:none;border:none;color:var(--muted2);cursor:pointer;
  padding:5px 7px;border-radius:7px;font-size:.72rem;flex-shrink:0;
  transition:all var(--ease);}
.ci-del:active{color:var(--red);background:var(--red-bg);}

/* ── BADGES ── */
.badge{display:inline-flex;align-items:center;padding:2px 7px;border-radius:99px;
  font-size:.52rem;font-weight:700;letter-spacing:.04em;}
.b-auto{background:var(--blue-bg);color:var(--blue);
  border:1px solid rgba(26,80,208,.15);}
.b-cnt{background:var(--g100);color:var(--g700);border:1px solid var(--g200);}
.b-purple{background:rgba(109,40,200,.08);color:var(--purple);
  border:1px solid rgba(109,40,200,.15);}
.b-green{background:var(--g100);color:var(--g700);border:1px solid var(--g200);}
.b-amber{background:var(--amber-bg);color:var(--amber);
  border:1px solid rgba(196,122,0,.18);}

/* ── GEN BUTTONS ── */
.gen-btn{padding:14px 8px;border-radius:12px;border:1.5px solid;
  font-family:'Syne',sans-serif;font-size:.68rem;font-weight:800;
  letter-spacing:.04em;cursor:pointer;transition:all var(--ease);
  text-align:center;text-transform:uppercase;width:100%;
  display:flex;flex-direction:column;align-items:center;gap:4px;}
.gen-btn:active{transform:scale(.95);}
.gen-btn .gico{font-size:1.4rem;margin-bottom:2px;}
.gen-btn small{font-family:'Plus Jakarta Sans',sans-serif;font-size:.55rem;
  color:var(--muted);text-transform:none;font-weight:600;margin-top:1px;}
.gen-btn.quot{border-color:var(--amber);color:var(--amber);background:var(--amber-bg);}
.gen-btn.recv{border-color:var(--g500);color:var(--g600);background:var(--g50);}
.gen-btn.invc{border-color:var(--blue);color:var(--blue);background:var(--blue-bg);}
.gen-btn-all{padding:15px;border-radius:13px;border:2px dashed var(--g300);
  background:var(--g50);font-family:'Syne',sans-serif;font-size:.7rem;font-weight:800;
  letter-spacing:.04em;cursor:pointer;transition:all var(--ease);
  text-align:center;text-transform:uppercase;width:100%;
  display:flex;flex-direction:column;align-items:center;gap:4px;color:var(--g700);}
.gen-btn-all:active{transform:scale(.97);background:var(--g100);}
.gen-btn-all small{font-family:'Plus Jakarta Sans',sans-serif;font-size:.57rem;
  color:var(--muted);text-transform:none;font-weight:600;}

/* ── CALC ROWS ── */
.cr{display:flex;justify-content:space-between;align-items:center;
  padding:8px 0;border-bottom:1px solid var(--bdr);font-size:.82rem;font-weight:600;}
.cr:last-child{border-bottom:none;font-weight:800;color:var(--g700);
  font-size:.88rem;padding-top:10px;}
.cr-lbl{color:var(--txt2);}

/* ── SUGGESTION BOX ── */
.sug-box{background:linear-gradient(135deg,var(--g50),var(--surf));
  border:1.5px solid var(--g200);border-radius:12px;padding:13px 14px;margin-top:10px;}
.sug-box-title{font-size:.58rem;font-weight:800;text-transform:uppercase;
  letter-spacing:.08em;color:var(--muted2);margin-bottom:9px;}
.sug-row{display:flex;justify-content:space-between;align-items:center;
  padding:5px 0;font-size:.79rem;}
.sug-lbl{color:var(--txt2);font-weight:600;}
.sug-val{font-weight:800;font-variant-numeric:tabular-nums;}
.sug-total{color:var(--g700);font-weight:800;border-top:1px solid var(--bdr);
  padding-top:7px;margin-top:5px;font-size:.84rem;}
.sug-apply{background:var(--g600);color:#fff;border:none;border-radius:8px;
  padding:8px 15px;font-size:.73rem;font-weight:700;cursor:pointer;margin-top:9px;
  font-family:'Plus Jakarta Sans',sans-serif;box-shadow:0 2px 8px rgba(22,104,57,.25);
  transition:all var(--ease);}
.sug-apply:active{transform:scale(.97);}
.sug-badge{font-size:.55rem;padding:2px 5px;border-radius:4px;
  font-weight:700;margin-left:5px;}
.sug-badge-prev{background:var(--g100);color:var(--g700);}
.sug-badge-calc{background:rgba(109,40,200,.08);color:var(--purple);}

/* ── DOC STATUS / PCT ── */
.dns{font-size:.66rem;margin-top:5px;padding:5px 10px;border-radius:7px;font-weight:700;}
.dns.warn{background:var(--red-bg);color:var(--red);}
.dns.ok{background:var(--g50);color:var(--g700);}
.pct-tag{display:inline-block;font-size:.58rem;font-weight:700;
  padding:2px 7px;border-radius:5px;margin-top:3px;}
.pct-ok{background:var(--g50);color:var(--g700);}
.pct-err{background:var(--red-bg);color:var(--red);}

/* ── DIVIDER / TIP ── */
.divider{height:1px;background:var(--bdr);margin:13px 0;}
.tip{font-size:.64rem;color:var(--muted);font-style:italic;line-height:1.6;margin-top:4px;}

/* ── TOAST ── */
.toast{position:fixed;bottom:calc(var(--nav) + 14px);left:50%;
  transform:translateX(-50%) translateY(10px);
  background:var(--g900);color:#fff;padding:10px 20px;border-radius:11px;
  font-size:.78rem;font-weight:700;z-index:9999;pointer-events:none;
  opacity:0;transition:all .2s var(--ease);white-space:nowrap;
  max-width:90vw;text-align:center;box-shadow:0 4px 20px rgba(0,0,0,.32);}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0);}
.toast.err{background:var(--red);}
.toast.warn{background:var(--amber);}
@media(min-width:700px){.toast{bottom:22px;}}

/* ── MODAL ── */
.modal-ov{display:none;position:fixed;inset:0;background:rgba(0,0,0,.55);
  z-index:600;align-items:flex-end;justify-content:center;backdrop-filter:blur(4px);}
.modal-ov.open{display:flex;}
.modal{background:var(--surf);border:1px solid var(--bdr);
  border-radius:20px 20px 0 0;
  padding:20px 17px calc(env(safe-area-inset-bottom,0px)+22px);
  width:100%;max-width:520px;max-height:92vh;overflow-y:auto;
  box-shadow:0 -6px 40px rgba(0,0,0,.22);}
.modal h2{font-family:'Syne',sans-serif;font-size:1rem;font-weight:800;
  margin-bottom:15px;color:var(--g700);}
.modal-foot{display:flex;gap:8px;justify-content:flex-end;
  margin-top:15px;padding-top:12px;border-top:1px solid var(--bdr);}
.pill{width:36px;height:4px;background:var(--bdr2);border-radius:99px;margin:0 auto 15px;}
@media(min-width:700px){
  .modal-ov{align-items:center;}
  .modal{border-radius:18px;max-width:500px;}
}

/* ── SPINNER ── */
.spin-ov{display:none;position:fixed;inset:0;background:rgba(0,0,0,.68);
  z-index:800;align-items:center;justify-content:center;flex-direction:column;
  gap:15px;backdrop-filter:blur(5px);}
.spin-ov.open{display:flex;}
.spinner{width:42px;height:42px;border:3px solid rgba(255,255,255,.14);
  border-top-color:var(--g300);border-radius:50%;animation:rotateit .62s linear infinite;}
.spin-msg{font-size:.83rem;font-weight:700;color:rgba(255,255,255,.86);}

/* ── AUTH SCREEN ── */
.auth-screen{position:fixed;inset:0;z-index:9999;
  background:var(--g900);
  display:flex;flex-direction:column;align-items:center;
  justify-content:center;gap:24px;padding:28px;}
.auth-screen::before{content:'';position:absolute;inset:0;
  background:radial-gradient(ellipse 80% 60% at 50% 0%,rgba(45,160,90,.25) 0%,transparent 65%);
  pointer-events:none;}
.auth-logo{font-family:'Syne',sans-serif;font-weight:800;font-size:2.4rem;
  color:#fff;letter-spacing:.04em;position:relative;}
.auth-logo em{color:var(--g300);font-style:normal;}
.auth-tagline{font-size:.8rem;color:rgba(255,255,255,.45);
  text-align:center;letter-spacing:.02em;margin-top:-16px;position:relative;}
.auth-card{background:rgba(255,255,255,.07);
  border:1px solid rgba(255,255,255,.13);border-radius:20px;
  padding:26px 22px;display:flex;flex-direction:column;align-items:center;
  gap:15px;max-width:300px;width:100%;position:relative;}
.auth-sub{font-size:.78rem;color:rgba(255,255,255,.55);
  text-align:center;line-height:1.7;}
.auth-btn{background:#fff;color:#1a1a1a;border:none;border-radius:11px;
  padding:13px 22px;font-family:'Plus Jakarta Sans',sans-serif;font-size:.87rem;
  font-weight:700;cursor:pointer;display:flex;align-items:center;gap:10px;
  box-shadow:0 4px 18px rgba(0,0,0,.24);
  transition:all var(--ease);width:100%;justify-content:center;}
.auth-btn:active{transform:scale(.97);}
.auth-btn svg{width:19px;height:19px;flex-shrink:0;}
.auth-error{color:#fca5a5;font-size:.76rem;text-align:center;line-height:1.5;}

/* ── FB STATUS BAR ── */
.fb-bar{background:var(--g100);border-bottom:1px solid var(--bdr);padding:5px 15px;
  font-size:.65rem;font-weight:700;color:var(--g700);display:flex;align-items:center;gap:6px;}
.fb-bar.err{background:var(--red-bg);color:var(--red);}
.fb-bar.warn{background:var(--amber-bg);color:var(--amber);}

/* ── DESKTOP SIDEBAR ── */
@media(min-width:700px){
  .sidebar{display:flex !important;width:282px;min-width:282px;}
  .sb-ov{display:none !important;}
  .main{padding:18px 24px 24px;}
}
@media(min-width:1100px){
  .sidebar{width:306px;min-width:306px;}
  .main{padding:22px 36px;}
  .main-inner{max-width:760px;}
}

/* ── PDF CONTAINER ── */
#pdf-ct{position:absolute;left:-9999px;top:0;width:210mm;}
</style>
</head>
<body>
<div id="app">

<!-- ── AUTH SCREEN ── -->
<div v-if="!authUser && authChecked" class="auth-screen">
  <div class="auth-logo">MOIN<em>docs</em></div>
  <p class="auth-tagline">Vehicle Document Management</p>
  <div class="auth-card">
    <div class="auth-sub">Sign in with your Google account to access your documents and customer records.</div>
    <button class="auth-btn" @click="signInGoogle">
      <svg viewBox="0 0 48 48"><path fill="#FFC107" d="M43.611 20.083H42V20H24v8h11.303c-1.649 4.657-6.08 8-11.303 8-6.627 0-12-5.373-12-12s5.373-12 12-12c3.059 0 5.842 1.154 7.961 3.039l5.657-5.657C34.046 6.053 29.268 4 24 4 12.955 4 4 12.955 4 24s8.955 20 20 20 20-8.955 20-20c0-1.341-.138-2.65-.389-3.917z"/><path fill="#FF3D00" d="m6.306 14.691 6.571 4.819C14.655 15.108 18.961 12 24 12c3.059 0 5.842 1.154 7.961 3.039l5.657-5.657C34.046 6.053 29.268 4 24 4 16.318 4 9.656 8.337 6.306 14.691z"/><path fill="#4CAF50" d="M24 44c5.166 0 9.86-1.977 13.409-5.192l-6.19-5.238A11.91 11.91 0 0 1 24 36c-5.202 0-9.619-3.317-11.283-7.946l-6.522 5.025C9.505 39.556 16.227 44 24 44z"/><path fill="#1976D2" d="M43.611 20.083H42V20H24v8h11.303a12.04 12.04 0 0 1-4.087 5.571l.003-.002 6.19 5.238C36.971 39.205 44 34 44 24c0-1.341-.138-2.65-.389-3.917z"/></svg>
      Continue with Google
    </button>
    <div v-if="authError" class="auth-error">{{ authError }}</div>
  </div>
</div>

<!-- Loading screen while auth initialises -->
<div v-if="!authChecked" class="auth-screen">
  <div class="auth-logo">MOIN<em>docs</em></div>
  <div style="display:flex;flex-direction:column;align-items:center;gap:12px;margin-top:-8px;">
    <div class="spinner" style="border-top-color:var(--g300);"></div>
    <p style="font-size:.76rem;color:rgba(255,255,255,.45);">Loading…</p>
  </div>
</div>

<div v-if="authChecked && !authUser" style="display:none;"></div>
<template v-if="authUser">

<!-- ── HEADER ── -->
<header class="hdr">
  <!-- Mobile menu toggle -->
  <button class="hdr-menu" @click="sideOpen=!sideOpen" aria-label="Menu">
    <svg width="18" height="18" viewBox="0 0 18 18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
      <line x1="2" y1="5" x2="16" y2="5"/><line x1="2" y1="9" x2="16" y2="9"/><line x1="2" y1="13" x2="16" y2="13"/>
    </svg>
  </button>

  <!-- Brand -->
  <div class="hdr-logo">
    <span class="lico">M</span>
    <div class="hdr-brand">
      <span class="hdr-brand-name">MOIN<em>docs</em></span>
      <span class="hdr-sub">{{ currentOrg ? currentOrg.name : 'No org' }}</span>
    </div>
  </div>

  <!-- Right actions -->
  <div class="hdr-actions">
    <!-- Save dot only (no label on mobile) -->
    <div v-if="saveStatus" class="save-dot-wrap"
      :title="saveStatus==='cloud'?'Saved to cloud':saveStatus==='local'?'Saved locally':saveStatus==='saving'?'Saving…':'Save error'">
      <div class="save-dot" :class="saveStatus"></div>
    </div>

    <!-- New customer button -->
    <button class="hdr-new" @click="newCustomer">
      <svg width="12" height="12" viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round">
        <line x1="6" y1="1" x2="6" y2="11"/><line x1="1" y1="6" x2="11" y2="6"/>
      </svg>
      <span class="hdr-new-label">New</span>
    </button>

    <!-- Avatar — tap to sync/sign-out -->
    <div class="auth-user" @click="signOut" title="Sign out">
      <img v-if="authUser.photoURL" :src="authUser.photoURL" class="auth-avatar" :alt="authUser.displayName">
      <span v-else class="auth-avatar auth-avatar-init">{{ (authUser.displayName||'U')[0] }}</span>
    </div>
  </div>
</header>

<!-- FB STATUS -->
<div v-if="fbMsg" class="fb-bar" :class="fbMsgCls">{{ fbMsg }}</div>

<!-- SIDEBAR OVERLAY -->
<div class="sb-ov" :class="{open:sideOpen}" @click="sideOpen=false"></div>

<!-- LAYOUT -->
<div class="layout" :style="fbMsg?'padding-top:calc(var(--hh)+27px)':''">

  <!-- ── SIDEBAR ── -->
  <aside class="sidebar" :class="{open:sideOpen}">
    <div style="display:flex;flex-direction:column;height:100%;gap:0;">
      <div class="sec-ttl">
        Customers
        <span class="badge b-cnt">{{ customers.length }}/50</span>
      </div>
      <!-- Search -->
      <div style="margin-bottom:9px;">
        <input v-model="sideSearch" type="text" placeholder="Search customers…"
          style="font-size:.78rem;padding:8px 11px;border-radius:8px;">
      </div>
      <div style="overflow-y:auto;flex:1;padding-right:2px;">
        <div v-for="c in filteredCustomers" :key="c.id" class="ci"
          :class="{active:curCustId===c.id}"
          @click="loadCustomer(c.id);sideOpen=false">
          <div style="min-width:0;overflow:hidden;">
            <div class="ci-name" style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap;">{{ c.name||'Unnamed' }}</div>
            <div class="ci-meta">{{ c.model||'—' }} · #{{ c.invno||'—' }}</div>
          </div>
          <button class="ci-del" @click.stop="confirmDeleteCust(c.id)" title="Delete">
            <svg width="10" height="10" viewBox="0 0 10 10" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
              <line x1="1" y1="1" x2="9" y2="9"/><line x1="9" y1="1" x2="1" y2="9"/>
            </svg>
          </button>
        </div>
        <div v-if="!filteredCustomers.length" style="text-align:center;padding:20px 0;">
          <div style="font-size:1.4rem;margin-bottom:6px;">{{ customers.length ? '🔍' : '👤' }}</div>
          <div style="font-size:.74rem;color:var(--muted);">{{ customers.length ? 'No matches' : 'No customers yet' }}</div>
        </div>
      </div>
      <button class="btn btn-primary btn-sm btn-full"
        style="margin-top:9px;flex-shrink:0;"
        @click="newCustomer();sideOpen=false">
        + New Customer
      </button>
    </div>
  </aside>

  <!-- ── MAIN ── -->
  <main class="main">
    <div class="main-inner">

    <!-- Desktop tab bar -->
    <div class="tab-bar">
      <button v-for="t in tabs" :key="t.id" class="tab-btn" :class="{active:tab===t.id}" @click="tab=t.id">
        {{ t.icon }} {{ t.label }}
      </button>
    </div>

    <!-- ═══ CUSTOMER TAB ═══ -->
    <div class="tab-pane" :class="{active:tab==='customer'}">
      <div class="card">
        <div class="card-ttl"><span class="ti">👤</span> Customer Details</div>

        <!-- Organisation selector -->
        <div class="fg">
          <label>Organisation</label>
          <div style="display:flex;gap:6px;align-items:stretch;">
            <select v-model="f.orgId" @change="onOrgChange" style="flex:1;min-width:0;">
              <option value="">— Select Org —</option>
              <option v-for="o in orgs" :key="o.id" :value="o.id">{{ o.name }}</option>
            </select>
            <button class="btn btn-outline btn-sm" style="flex-shrink:0;" @click="openOrgModal()">+ Add</button>
            <button v-if="f.orgId" class="btn btn-ghost btn-sm" style="flex-shrink:0;" @click="editOrg">✏</button>
            <button v-if="f.orgId" class="btn btn-danger btn-sm" style="flex-shrink:0;" @click="deleteOrg">✕</button>
          </div>
        </div>

        <div class="fg"><label>Full Name</label>
          <input v-model="f.name" type="text" placeholder="KRISHNA SHYAMLAL GUPTA" @input="touchDate"></div>
        <div class="fg"><label>Address</label>
          <input v-model="f.address" type="text" placeholder="Nityanand nagar lbs road mumbai 400086" @input="touchDate"></div>
        <div class="row2">
          <div class="fg"><label>Date</label><input v-model="f.date" type="date"></div>
          <div class="fg">
            <label>Doc / Invoice No.</label>
            <div class="ac-wrap">
              <input v-model="f.invno" type="text" placeholder="4004" @input="acDocno=dnoSug.length>0"
                @blur="st(()=>acDocno=false,250)" autocomplete="off" inputmode="numeric">
              <div class="ac-drop" :class="{open:acDocno}">
                <div v-for="u in dnoSug" :key="u.no" class="ac-item ac-used">
                  <strong>#{{ u.no }}</strong><span class="ac-used-tag">USED</span>
                  <div class="ac-sub">{{ u.customerName }} · {{ fd(u.date) }}</div>
                </div>
              </div>
            </div>
            <div v-if="dnoStatus.txt" class="dns" :class="dnoStatus.cls">{{ dnoStatus.txt }}</div>
          </div>
        </div>

        <!-- Financier — editable, autocomplete from past customers, default SMFG -->
        <div class="fg">
          <label>Financier / HP Company</label>
          <div class="ac-wrap">
            <input v-model="f.hp" type="text" placeholder="SMFG INDIA CREDIT COMPANY LIMITED"
              @input="onHpInput" @focus="onHpFocus" @blur="st(()=>acHp=false,250)" autocomplete="off">
            <div class="ac-drop" :class="{open:acHp}">
              <div v-for="h in hpSug" :key="h" class="ac-item" @click="f.hp=h;acHp=false;touchDate()">{{ h }}</div>
            </div>
          </div>
        </div>
      </div>
    </div>

    <!-- ═══ VEHICLE TAB ═══ -->
    <div class="tab-pane" :class="{active:tab==='vehicle'}">
      <div class="card">
        <div class="card-ttl"><span class="ti">🏍</span> Vehicle Details</div>
        <div class="fg">
          <label>Model Name</label>
          <div class="ac-wrap">
            <input v-model="f.model" type="text" placeholder="Burgman Street OBD 2"
              @input="onModelInput" @focus="onModelFocus" @blur="st(()=>acModel=false,250)" autocomplete="off">
            <div class="ac-drop" :class="{open:acModel}">
              <div v-for="m in modelSug" :key="m" class="ac-item" @click="selectModel(m)">
                {{ m }}
                <div v-if="mData[m.toLowerCase()]?.onroad" class="ac-sub">₹{{ fmt(mData[m.toLowerCase()].onroad) }} on-road</div>
              </div>
            </div>
          </div>
          <div v-if="!f.model && uModels.length" class="tip" style="margin-top:4px;">Start typing to search {{ uModels.length }} saved models</div>
        </div>
        <div class="row2">
          <div class="fg"><label>Engine No.</label><input v-model="f.engno" type="text" placeholder="AF215547135" @input="touchDate"></div>
          <div class="fg"><label>Chassis No.</label><input v-model="f.chassis" type="text" placeholder="MB8EA115BT8356692" @input="touchDate"></div>
        </div>
      </div>
    </div>

    <!-- ═══ FINANCE TAB ═══ -->
    <div class="tab-pane" :class="{active:tab==='financials'}">

      <!-- Smart suggestion — single card if model has saved data -->
      <div v-if="onroadSuggestions.length" class="card" style="border-color:var(--g400);border-width:2px;">
        <div class="card-ttl" style="color:var(--g700);margin-bottom:8px;"><span class="ti">💡</span> Smart Suggestion — {{ f.model }}</div>
        <div class="sug-box" style="margin-top:0;">
          <div class="sug-box-title" style="font-size:.59rem;color:var(--muted);">{{ onroadSuggestions[0].label }}</div>
          <div class="sug-row"><span class="sug-lbl">Ex-Showroom</span><span class="sug-val">₹{{ fmt(onroadSuggestions[0].ex) }}</span></div>
          <div class="sug-row"><span class="sug-lbl">RTO</span><span class="sug-val">₹{{ fmt(onroadSuggestions[0].rto) }}</span></div>
          <div class="sug-row"><span class="sug-lbl">Insurance</span><span class="sug-val">₹{{ fmt(onroadSuggestions[0].ins) }}</span></div>
          <div class="sug-row"><span class="sug-lbl">HP</span><span class="sug-val">₹500</span></div>
          <div class="sug-row"><span class="sug-lbl">Accessories</span><span class="sug-val">₹2,000</span></div>
          <div class="sug-row sug-total"><span>On-Road Total</span><span>₹{{ fmt(onroadSuggestions[0].total) }}</span></div>
          <button class="sug-apply" @click="applySuggestion(onroadSuggestions[0])">✅ Apply to form</button>
        </div>
      </div>

      <!-- Quick-Fill card -->
      <div class="card">
        <div class="card-ttl"><span class="ti">⚡</span> Quotation Quick-Fill</div>
        <p class="tip" style="margin-bottom:10px;">Enter approx On-Road → Ex-Showroom back-calculated. HP=₹500 &amp; Acc=₹2,000 fixed.</p>
        <div class="fg">
          <label>Approx On-Road Price</label>
          <div style="display:flex;gap:8px;align-items:center;">
            <input v-model.number="qApprox" type="number" placeholder="130000" inputmode="numeric" @input="quotCalc" style="flex:1;min-width:0;">
            <button class="btn btn-outline btn-sm" @click="quotRandom" style="flex-shrink:0;white-space:nowrap;">🎲 Re-roll</button>
          </div>
        </div>
        <div v-if="qv.total" style="margin-top:10px;">
          <div class="cr"><span class="cr-lbl">Ex-Showroom</span><span>₹{{ fmt(qv.ex) }}</span></div>
          <div class="cr"><span class="cr-lbl">RTO</span><span>₹{{ fmt(qv.rto) }}</span></div>
          <div class="cr"><span class="cr-lbl">Insurance</span><span>₹{{ fmt(qv.ins) }}</span></div>
          <div class="cr"><span class="cr-lbl">HP</span><span>₹500</span></div>
          <div class="cr"><span class="cr-lbl">Accessories</span><span>₹2,000</span></div>
          <div class="cr"><span class="cr-lbl">On-Road Total</span><span>₹{{ fmt(qv.total) }}</span></div>
          <button class="btn btn-primary btn-sm" style="margin-top:10px;" @click="applyQuot">✅ Apply to form</button>
        </div>
      </div>

      <!-- On-road breakdown -->
      <div class="card">
        <div class="card-ttl"><span class="ti">🛣</span> On-Road Breakdown</div>
        <div class="fg">
          <label>On-Road Total <span class="badge b-auto">enter this — fixed</span></label>
          <input v-model.number="f.onroad" type="number" placeholder="130000" inputmode="numeric" @input="calc();touchDate()">
        </div>
        <p class="tip" style="margin-bottom:10px;">Fix On-Road first. Changing charges below back-calculates Ex-Showroom.</p>
        <div class="row3">
          <div class="fg">
            <label>RTO</label>
            <input v-model.number="f.rto" type="number" placeholder="12000" inputmode="numeric" @input="calc();touchDate()">
            <span v-if="rtoPct!==null" :class="['pct-tag',rtoPct<15?'pct-ok':'pct-err']">{{ rtoPct.toFixed(1) }}%</span>
          </div>
          <div class="fg">
            <label>Insurance</label>
            <input v-model.number="f.insurance" type="number" placeholder="5500" inputmode="numeric" @input="calc();touchDate()">
          </div>
          <div class="fg">
            <label>HP <span class="badge b-auto">₹500</span></label>
            <input v-model.number="f.hpcharge" type="number" inputmode="numeric" @input="calc();touchDate()">
          </div>
          <div class="fg">
            <label>Accessories <span class="badge b-auto">₹2000</span></label>
            <input v-model.number="f.accessories" type="number" inputmode="numeric" @input="calc();touchDate()">
          </div>
          <div class="fg span-full" style="grid-column:1/-1">
            <label>Ex-Showroom <span class="badge b-auto">auto</span></label>
            <input :value="f.exshowroom" type="number" readonly>
          </div>
        </div>

        <div class="divider"></div>

        <!-- IDV saved per model in vehicles DB -->
        <div class="fg">
          <label>IDV Value <span class="badge b-auto">saved per model</span></label>
          <div class="ac-wrap">
            <input v-model.number="f.idv" type="number" placeholder="98000" inputmode="numeric"
              @input="onIdvChange();touchDate()" @focus="onIdvFocus" @blur="st(()=>acIdv=false,250)" autocomplete="off">
            <div class="ac-drop" :class="{open:acIdv}">
              <div v-for="s in idvSug" :key="s.label" class="ac-item" @click="f.idv=s.val;acIdv=false;onIdvChange()">{{ s.label }}</div>
            </div>
          </div>
          <span v-if="idvPct!==null" :class="['pct-tag',idvPct>=90?'pct-ok':'pct-err']">IDV {{ idvPct.toFixed(1) }}% of Ex-Showroom</span>
        </div>

        <div class="divider"></div>
        <div class="card-ttl" style="margin-top:0;margin-bottom:12px;"><span class="ti">📊</span> GST Breakdown</div>
        <div class="row3">
          <div class="fg"><label>CGST 9% <span class="badge b-auto">auto</span></label><input :value="f.cgst" type="number" readonly></div>
          <div class="fg"><label>SGST 9% <span class="badge b-auto">auto</span></label><input :value="f.sgst" type="number" readonly></div>
          <div class="fg"><label>Basic <span class="badge b-auto">auto</span></label><input :value="f.basic" type="number" readonly></div>
        </div>
        <p class="tip">CGST = SGST = Ex × 9/118 &nbsp;|&nbsp; Basic = Ex − CGST − SGST</p>

        <div class="divider"></div>
        <div class="card-ttl" style="margin-top:0;margin-bottom:12px;"><span class="ti">💵</span> Down Payment</div>
        <div class="row2">
          <div class="fg"><label>Cash Received</label>
            <input v-model.number="f.cash" type="number" placeholder="38500" inputmode="numeric" @input="autoCash();touchDate()"></div>
          <div class="fg"><label>Amount in Words <span class="badge b-auto">auto</span></label>
            <input v-model="f.words" type="text" placeholder="THIRTY EIGHT THOUSAND ONLY" @input="touchDate"></div>
        </div>
      </div>
    </div>

    <!-- ═══ GENERATE TAB ═══ -->
    <div class="tab-pane" :class="{active:tab==='generate'}">

      <!-- Summary card -->
      <div class="card">
        <div class="card-ttl"><span class="ti">👁</span> Document Summary</div>
        <div style="display:grid;grid-template-columns:1fr 1fr;gap:0;">
          <div style="padding:7px 0;border-bottom:1px solid var(--bdr);">
            <div style="font-size:.57rem;color:var(--muted);font-weight:700;text-transform:uppercase;letter-spacing:.06em;margin-bottom:2px;">Customer</div>
            <div style="font-size:.85rem;font-weight:700;">{{ f.name||'—' }}</div>
          </div>
          <div style="padding:7px 0 7px 12px;border-bottom:1px solid var(--bdr);">

<script>
// ══════════════════════════════════════════════════════
//  FIREBASE CONFIG — paste your project config here
// ══════════════════════════════════════════════════════
const FB_CONFIG= {
  apiKey: "AIzaSyCuw7vvyQOIq9iK-0d6XwPKgB896o0k0iI",
  authDomain: "note-be8a4.firebaseapp.com",
  projectId: "note-be8a4",
  storageBucket: "note-be8a4.firebasestorage.app",
  messagingSenderId: "861406985317",
  appId: "1:861406985317:web:361718601f24ae5cbb5a8c",
  measurementId: "G-V5XK4631J4"
};
// Firestore structure:
//   moindocs/state  → { orgs, customers, usedNos, mData, ts }
//   mData[modelKey] → { onroad, idvValues[], insurance, idvAvg }
// Stamp images stored as base64 strings inside org objects (free-tier Firestore OK if < 900KB per doc)

// ── UTILS ──
function n2w(n){
  const o=['','one','two','three','four','five','six','seven','eight','nine','ten','eleven','twelve','thirteen','fourteen','fifteen','sixteen','seventeen','eighteen','nineteen'];
  const t=['','','twenty','thirty','forty','fifty','sixty','seventy','eighty','ninety'];
  function c(x){if(!x)return'';if(x<20)return o[x];if(x<100)return t[Math.floor(x/10)]+(x%10?' '+o[x%10]:'');
    if(x<1000)return o[Math.floor(x/100)]+' hundred'+(x%100?' '+c(x%100):'');
    if(x<100000)return c(Math.floor(x/1000))+' thousand'+(x%1000?' '+c(x%1000):'');
    if(x<10000000)return c(Math.floor(x/100000))+' lakh'+(x%100000?' '+c(x%100000):'');
    return c(Math.floor(x/10000000))+' crore'+(x%10000000?' '+c(x%10000000):'');}
  return c(Math.round(n));
}
const pf = v => parseFloat(v) || 0;
const fmt = v => { const x = parseFloat(v); return (!x && x !== 0) ? '' : x.toLocaleString('en-IN'); };
const today = () => new Date().toISOString().split('T')[0];
const fd = s => { if (!s) return ''; const [y, m, d] = s.split('-'); return `${d}/${m}/${y}`; };

const { createApp, ref, computed, reactive } = Vue;

createApp({
  setup() {
    // ── AUTH STATE ──
    const authUser = ref(null);
    const authChecked = ref(false);
    const authError = ref('');

    // ── STATE ──
    const orgs = ref([]);
    const customers = ref([]);
    const usedNos = ref({});
    // mData: { [modelKey]: { onroad, idvValues:[], idvAvg, insurance } }
    const mData = ref({});

    const curCustId = ref(null);
    const editOrgId = ref(null);
    const tab = ref('customer');
    const sideOpen = ref(false);

    const tabs = [
      { id: 'customer',   icon: '👤', label: 'Customer' },
      { id: 'vehicle',    icon: '🏍', label: 'Vehicle' },
      { id: 'financials', icon: '💰', label: 'Finance' },
      { id: 'generate',   icon: '📄', label: 'Generate' },
    ];

    const bf = () => ({
      name:'', address:'', date:today(), invno:'', hp:'SMFG INDIA CREDIT COMPANY LIMITED',
      model:'', engno:'', chassis:'',
      exshowroom:'', rto:'', insurance:'', hpcharge:500, accessories:2000,
      onroad:'', basic:'', cgst:'', sgst:'', cash:'', words:'',
      idv:'', orgId:''
    });
    const f = reactive(bf());

    const qApprox = ref('');
    const qv = reactive({ ex:0, rto:0, ins:0, hp:500, acc:2000, total:0 });

    const orgModal = ref(false);
    const om = reactive({ name:'', addr:'', gst:'', bank:'', neft:'', stamp:'' });

    // UI
    const tMsg = ref(''), tShow = ref(false), tType = ref('success');
    let tTid = null;
    const spinning = ref(false), spinMsg = ref('');
    const acDocno = ref(false), acHp = ref(false), acModel = ref(false);
    const acIdv = ref(false);
    const confirmDeleteId = ref(null), confirmDeleteName = ref('');
    const sideSearch = ref('');
     const filteredCustomers = computed(() => {
  const q = sideSearch.value.toLowerCase().trim();
  if (!q) return customers.value;
  return customers.value.filter(c => 
    (c.name && c.name.toLowerCase().includes(q)) ||
    (c.model && c.model.toLowerCase().includes(q)) ||
    (c.invno && c.invno.toLowerCase().includes(q))
  );
});
     

    // Firebase
    const fbSyncing = ref(false), fbMsg = ref(''), fbMsgCls = ref('');
    // Save status: 'local' = saved locally only, 'cloud' = saved to Firebase, 'saving' = in progress, 'error' = failed
    const saveStatus = ref(''); // '' | 'local' | 'saving' | 'cloud' | 'error'
    let db = null;

    function toast(m, tp = 'success') {
      tMsg.value = m; tType.value = tp; tShow.value = true;
      clearTimeout(tTid); tTid = setTimeout(() => tShow.value = false, 3200);
    }
    function spin(m) { spinMsg.value = m; spinning.value = true; }
    function unspin() { spinning.value = false; }

    // ══ FIREBASE ══
    function initFb() {
      try {
        const app = firebase.apps.length ? firebase.apps[0] : firebase.initializeApp(FB_CONFIG);
        db = app.firestore();
        const auth = app.auth();
        fbMsg.value = ''; fbMsgCls.value = '';
        // Listen for auth state
        handleRedirectResult(); // consume any pending redirect
        auth.onAuthStateChanged(user => {
          authUser.value = user;
          authChecked.value = true;
          if (user) {
            loadFb();
          } else {
            loadLocal();
          }
        });
      } catch (e) {
        console.warn('Firebase:', e);
        authChecked.value = true;
        fbMsg.value = '⚠ Firebase not configured — using local storage';
        fbMsgCls.value = 'warn';
        loadLocal();
      }
    }

    async function signInGoogle() {
      try {
        authError.value = '';
        const provider = new firebase.auth.GoogleAuthProvider();
        const auth = firebase.auth();
        // Use redirect on mobile (popup fails on Android Chrome / partitioned storage)
        const isMobile = /Android|iPhone|iPad|iPod/i.test(navigator.userAgent);
        if (isMobile) {
          await auth.signInWithRedirect(provider);
          // Page will reload — onAuthStateChanged handles the result
        } else {
          await auth.signInWithPopup(provider);
        }
      } catch (e) {
        authError.value = e.message || 'Sign-in failed';
      }
    }

    // Handle redirect result on page load
    async function handleRedirectResult() {
      try {
        const result = await firebase.auth().getRedirectResult();
        // result.user will be null if no redirect happened — that's fine
      } catch (e) {
        console.warn('Redirect result error:', e.message);
      }
    }

    async function signOut() {
      // Simple — no confirm dialog, just sign out cleanly
      try {
        await firebase.auth().signOut();
      } catch(e) { console.warn('signOut:', e); }
      customers.value = [];
      usedNos.value = {};
      mData.value = {};
      curCustId.value = null;
      Object.assign(f, bf());
      saveStatus.value = '';
      authUser.value = null;
    }

    // Helper: get the user-scoped doc path for customers/vehicles
    function userDocId() {
      return authUser.value ? authUser.value.uid : 'anonymous';
    }

    async function loadFb() {
      fbMsg.value = '☁ Loading…'; fbMsgCls.value = '';
      try {
        const uid = userDocId();
        // Load shared org data
        const orgSnap = await db.collection('moindocs').doc('orgs').get();
        if (orgSnap.exists) {
          const d = orgSnap.data();
          if (d.orgs) orgs.value = d.orgs;
        }
        // ── Always reset user-specific data before loading ──
        // This ensures one user never sees another user's customers
        customers.value = [];
        usedNos.value = {};
        mData.value = {};
        // Load user-specific customers + usedNos
        const userSnap = await db.collection('moindocs_users').doc(uid).get();
        if (userSnap.exists) {
          const d = userSnap.data();
          if (d.customers) customers.value = d.customers;
          if (d.usedNos && !Array.isArray(d.usedNos)) usedNos.value = d.usedNos;
        }
        // Load user-specific vehicle data
        const vSnap = await db.collection('moindocs_users').doc(uid + '_vehicles').get();
        if (vSnap.exists) {
          const vd = vSnap.data();
          if (vd.mData) mData.value = vd.mData;
        }
        saveLocal();
        setTimeout(() => { fbMsg.value = ''; fbMsgCls.value = ''; }, 2500);
        if (orgs.value.length && !f.orgId) f.orgId = orgs.value[0].id;
        autoNo();
      } catch (e) {
        console.error(e);
        fbMsg.value = '⚠ Firebase error — using local data';
        fbMsgCls.value = 'err';
        loadLocal();
      }
    }

    async function pushFb() {
      if (!db || !authUser.value) return;
      fbSyncing.value = true;
      saveStatus.value = 'saving';
      const uid = userDocId();
      try {
        await db.collection('moindocs').doc('orgs').set({
          orgs: orgs.value, ts: new Date().toISOString()
        });
        await db.collection('moindocs_users').doc(uid).set({
          customers: customers.value, usedNos: usedNos.value, ts: new Date().toISOString()
        });
        await db.collection('moindocs_users').doc(uid + '_vehicles').set({
          mData: mData.value, ts: new Date().toISOString()
        });
        saveStatus.value = 'cloud';
        fbSyncing.value = false;
      } catch (e) {
        console.error('Firestore save error:', e);
        saveStatus.value = 'error';
        fbSyncing.value = false;
        // Already saved locally — no toast spam on bandwidth errors
      }
    }

    // Debounce Firebase writes — max 1 write per 3 seconds
    let _fbDebounce = null;
    function save() {
      saveLocal();           // immediate — always
      clearTimeout(_fbDebounce);
      _fbDebounce = window.setTimeout(() => pushFb(), 3000);
    }

    function localKey() {
      return authUser.value ? `moin_v5_${authUser.value.uid}` : 'moin_v5_anon';
    }

    function saveLocal() {
      try {
        localStorage.setItem(localKey(), JSON.stringify({
          orgs: orgs.value, customers: customers.value,
          usedNos: usedNos.value, mData: mData.value
        }));
        if (saveStatus.value !== 'cloud') saveStatus.value = 'local';
      } catch (e) { saveStatus.value = 'error'; }
    }

    function loadLocal() {
      try {
        const r = localStorage.getItem(localKey());
        if (r) {
          const p = JSON.parse(r);
          if (p.orgs) orgs.value = p.orgs;
          // Only load user-specific data if we have a uid match
          if (p.customers) customers.value = p.customers;
          if (p.usedNos && !Array.isArray(p.usedNos)) usedNos.value = p.usedNos;
          if (p.mData) mData.value = p.mData;
        }
        if (orgs.value.length && !f.orgId) f.orgId = orgs.value[0].id;
        autoNo();
      } catch (e) {}
    }

    async function manualSync() {
      if (!db) { toast('Firebase not configured', 'warn'); return; }
      await loadFb(); toast('Synced ✓');
    }

    // ── MODEL DATA helpers ──
    function getMd(model) {
      if (!model) return null;
      return mData.value[model.toLowerCase()] || null;
    }

    function ensureMd(model) {
      if (!model) return;
      const k = model.toLowerCase();
      if (!mData.value[k]) mData.value[k] = { onroad: 0, idvValues: [], idvAvg: 0, insurance: 0 };
      return mData.value[k];
    }

    function saveMdOnroad(model, onroad) {
      if (!model || !onroad) return;
      const md = ensureMd(model);
      md.onroad = pf(onroad);
    }

    // RTO tax amount saved per model — always overwrite with latest value
    function saveMdRto(model, rto) {
      if (!model || !rto) return;
      const md = ensureMd(model);
      md.rto = pf(rto);
    }

    // IDV: accumulate values, store avg
    function saveMdIdv(model, idv) {
      if (!model || !idv) return;
      const md = ensureMd(model);
      if (!md.idvValues) md.idvValues = [];
      const v = pf(idv);
      if (md.idvValues[md.idvValues.length - 1] !== v) md.idvValues.push(v);
      if (md.idvValues.length > 10) md.idvValues = md.idvValues.slice(-10);
      md.idvAvg = Math.round(md.idvValues.reduce((a, b) => a + b, 0) / md.idvValues.length);
      // Also save calculated ex-showroom = idvAvg * 110%
      md.exCalc = Math.round(md.idvAvg * 1.10);
    }

    function saveMdInsurance(model, ins) {
      if (!model || !ins) return;
      const md = ensureMd(model);
      // Always overwrite with latest correct value
      md.insurance = pf(ins);
    }

    // ── ORG ──
    const currentOrg = computed(() => orgs.value.find(o => o.id === f.orgId) || null);

    function onOrgChange() { autoNo(); toast('Org changed', 'warn'); }
    function openOrgModal(eid = null) {
      editOrgId.value = eid;
      if (eid) {
        const o = orgs.value.find(x => x.id === eid);
        Object.assign(om, { name:o.name, addr:o.addr, gst:o.gst, bank:o.bank, neft:o.neft, stamp:o.stamp||'' });
      } else {
        Object.assign(om, { name:'', addr:'', gst:'', bank:'', neft:'', stamp:'' });
      }
      orgModal.value = true;
    }
    function editOrg() { openOrgModal(f.orgId); }
    function deleteOrg() {
      if (!confirm('Delete this organisation?')) return;
      delete usedNos.value[f.orgId];
      orgs.value = orgs.value.filter(o => o.id !== f.orgId);
      f.orgId = ''; save();
    }
    function prevStamp(e) {
      const file = e.target.files[0]; if (!file) return;
      // Warn if file is large
      if (file.size > 800 * 1024) {
        toast('Image > 800KB — Firestore may reject it. Compress first.', 'warn');
      }
      const r = new FileReader();
      r.onload = ev => { om.stamp = ev.target.result; };
      r.readAsDataURL(file);
    }
    function saveOrg() {
      if (!om.name.trim()) { toast('Company name required', 'error'); return; }
      const o = { id:editOrgId.value||Date.now().toString(), name:om.name.trim(), addr:om.addr, gst:om.gst, bank:om.bank, neft:om.neft, stamp:om.stamp };
      if (editOrgId.value) {
        const i = orgs.value.findIndex(x => x.id === editOrgId.value);
        if (i > -1) orgs.value[i] = o;
      } else {
        orgs.value.push(o); f.orgId = o.id;
      }
      save(); orgModal.value = false; toast('Organisation saved!');
    }

    // ── CUSTOMERS ──
    const uModels = computed(() => {
      const s = new Set();
      customers.value.forEach(c => { if (c.model) s.add(c.model); });
      // also include models from mData
      Object.keys(mData.value).forEach(k => {
        const found = [...s].find(m => m.toLowerCase() === k);
        if (!found && mData.value[k].onroad) s.add(k);
      });
      return [...s];
    });

    function getOrgNos() { if (!f.orgId) return []; return usedNos.value[f.orgId] || []; }
    function touchDate() { f.date = today(); }

    function gd() {
      return {
        name:f.name, address:f.address, date:f.date, invno:f.invno, hp:f.hp,

    function saveCust(showToast = false) {
      const d = gd();

      // Save vehicle data per model
      if (d.model) {
        if (d.onroad) saveMdOnroad(d.model, d.onroad);
        if (d.idv) saveMdIdv(d.model, d.idv);       // IDV saved per model
        if (d.rto) saveMdRto(d.model, d.rto);        // RTO saved per model
        if (d.insurance) saveMdInsurance(d.model, d.insurance); // insurance saved per model
      }
      const ex = curCustId.value ? customers.value.find(c => c.id === curCustId.value) : null;
      if (ex) { Object.assign(ex, d); }
      else {
        if (customers.value.length >= 50) customers.value.shift();
        const id = Date.now().toString();
        customers.value.push({ id, ...d });
        curCustId.value = id;

        else { al.customerName = d.name; al.date = d.date; }

      save();
      if (showToast) toast('Customer saved ✓');
      return true;

      return { txt:`✓ #${no} available in ${orgName}`, cls:'ok' };

    // ── RATE BADGES ──
    const rtoPct = computed(() => { const e = pf(f.exshowroom), r = pf(f.rto); if (!e || !r) return null; return (r / e) * 100; });
    const idvPct = computed(() => { const e = pf(f.exshowroom), i = pf(f.idv); if (!e || !i) return null; return (i / e) * 100; });

    // ── SINGLE SMART SUGGESTION using all saved vehicle data ──
    const onroadSuggestions = computed(() => {
      const model = f.model; if (!model) return [];
      const md = getMd(model); if (!md) return [];

      // Need at least IDV or on-road to show a suggestion
      const hasIdv = md.idvAvg && md.idvAvg > 0;
      const hasOnroad = md.onroad && md.onroad > 0;
      if (!hasIdv && !hasOnroad) return [];

      // Build suggestion: prefer calculated (idv-based) if we have IDV + ins + rto
      // Otherwise fall back to previously-used on-road
      let ex, rto, ins, source;
      const hp = 500, acc = 2000;

      if (hasIdv && md.insurance && md.rto) {
        // Full calculated suggestion: all data from vehicles DB
        ex = md.exCalc || Math.round(md.idvAvg * 1.10);
        rto = md.rto;
        ins = md.insurance;
        source = `IDV avg ₹${fmt(md.idvAvg)} × 110% + saved RTO & insurance`;
      } else if (hasIdv && md.insurance) {
        ex = md.exCalc || Math.round(md.idvAvg * 1.10);
        rto = Math.round(ex * 0.088);
        ins = md.insurance;
        source = `IDV avg ₹${fmt(md.idvAvg)} × 110% + saved insurance`;
      } else if (hasOnroad && md.insurance && md.rto) {
        // Previously saved real on-road, derive ex from components
        rto = md.rto; ins = md.insurance;
        ex = Math.max(0, md.onroad - rto - ins - hp - acc);
        source = `Previously used on-road ₹${fmt(md.onroad)}`;
      } else {
        // minimal — just onroad known
        if (!hasOnroad) return [];
        rto = md.rto || Math.round(md.onroad * 0.088);
        ins = md.insurance || 5500;
        ex = Math.max(0, md.onroad - rto - ins - hp - acc);
        source = `Previously used on-road ₹${fmt(md.onroad)}`;
      }

      const total = ex + rto + ins + hp + acc;
      return [{ label: source, ex, rto, ins, hp, acc, total }];
    });

      const o = pf(f.onroad), r = pf(f.rto), ins = pf(f.insurance), hp = pf(f.hpcharge), acc = pf(f.accessories);
      const ex = Math.max(0, Math.round(o - r - ins - hp - acc));

      else { f.cgst = ''; f.sgst = ''; f.basic = ''; }

      margin: 0,
      image: { type:'jpeg', quality:0.98 },
      html2canvas: { scale:2, useCORS:true, allowTaint:true, logging:false },
      jsPDF: { unit:'mm', format:'a4', orientation:'portrait' }
    };

    // ── GENERATE SINGLE ──
    async function genSingle(type, ws) {
      const org = currentOrg.value;
      if (!org) { toast('Please select an organisation!', 'error'); return; }
      const d = gd();
      if (!d.name) { toast('Customer name is required!', 'error'); return; }

      if (d.invno) {
        const used = getOrgNos().find(u => u.no === d.invno);
        const self = curCustId.value ? (customers.value.find(c => c.id === curCustId.value) || {}).invno : null;
        if (used && self !== d.invno) {
          if (!confirm(`Doc #${d.invno} already used for "${used.customerName}". Continue?`)) return;
        }
      }

      const { stamp, footer, hdr } = buildParts(org, ws);
      spin(`Generating ${type}…`);
      // Create a temp div appended directly to body (bypasses overflow:hidden)
      const ct = document.createElement('div');
      ct.style.cssText = 'position:absolute;left:-9999px;top:0;width:210mm;';
      document.body.appendChild(ct);
      try {
        let inner = '';
        if (type === 'quotation') inner = tplQ(d, org, hdr, footer);
        else if (type === 'receipt') inner = tplR(d, org, hdr, stamp);
        else inner = tplI(d, org, hdr, footer);

        ct.innerHTML = `<div style="width:210mm;padding:12mm 13mm;font-family:Arial,sans-serif;font-size:10.5pt;color:#000;background:#fff;">${inner}</div>`;

        await html2pdf().set({ ...PDFOPTS, filename: buildFname(type, d, ws) }).from(ct.firstChild).save();
        document.body.removeChild(ct);
        unspin();
        saveCust(false);
        toast(`${type.toUpperCase()} downloaded ✓`);
      } catch (e) {
        if (document.body.contains(ct)) document.body.removeChild(ct);
        unspin();
        toast('PDF error — try again', 'error'); console.error(e);
      }
    }

    // ── GENERATE ALL PLAIN — page1: receipt+quotation, page2: invoice ──
    // Renders each page separately into canvas, then combines into one PDF
    async function genAllPlain() {
      const org = currentOrg.value;
      if (!org) { toast('Please select an organisation!', 'error'); return; }
      const d = gd();
      if (!d.name) { toast('Customer name is required!', 'error'); return; }

      const nt = (d.name||'cust').trim().split(/\s+/)[0].toUpperCase().replace(/[^A-Z0-9]/g,'').slice(0,4);
      const { footer: ft2, hdr: hdr2 } = buildParts(org, false);

      const ex=pf(d.exshowroom), rto=pf(d.rto), ins=pf(d.insurance), hp=pf(d.hpcharge)||500, acc=pf(d.accessories)||2000;
      const tot=pf(d.onroad)||(ex+rto+ins+hp+acc);
      const totW = tot ? n2w(tot).toUpperCase() + ' ONLY' : '';
      const cash = pf(d.cash) || 0;

      // ── helper: render an HTML string into a canvas image ──
      async function renderPage(htmlContent) {
        const el = document.createElement('div');
        el.style.cssText = 'position:absolute;left:-9999px;top:0;width:210mm;background:#fff;';
        el.innerHTML = htmlContent;
        document.body.appendChild(el);
        try {
          const canvas = await html2pdf().set({
            image:{type:'jpeg',quality:0.98},
            html2canvas:{scale:2,useCORS:true,allowTaint:true,logging:false},
            jsPDF:{unit:'mm',format:'a4',orientation:'portrait'}
          }).from(el.firstChild).outputImg();
          return canvas;
        } finally {
          document.body.removeChild(el);
        }
      }

      const smHdr = `<div style="text-align:center;margin-bottom:3px;"><div style="font-size:14pt;font-weight:900;letter-spacing:1px;">${org.name}</div><div style="font-size:6pt;font-weight:700;">${org.addr}</div></div>`;

      const recHTML = `${smHdr}
<div style="font-size:13pt;font-weight:900;text-align:center;text-decoration:underline;letter-spacing:2px;margin:4px 0;">RECEIPT</div>
<div style="border:2px solid #000;font-size:8.5pt;">
<div style="display:flex;border-bottom:1px solid #000;"><div style="flex:0 0 38%;padding:3px 7px;font-weight:900;border-right:1px solid #000;">RECEIPT NO :-</div><div style="flex:1;padding:3px 7px;font-weight:900;">${d.invno}</div></div>
<div style="border-bottom:1px solid #000;padding:3px 7px;font-weight:900;">NAME :- ${d.name}</div>
<div style="border-bottom:1px solid #000;padding:3px 7px;">DATE :- ${fd(d.date)}</div>
<div style="display:flex;border-bottom:1px solid #000;"><div style="flex:0 0 28%;padding:3px 7px;font-weight:900;border-right:1px solid #000;">HP TO</div><div style="flex:0 0 4%;padding:3px 4px;border-right:1px solid #000;">:-</div><div style="flex:1;padding:3px 7px;">${d.hp}</div></div>
<div style="border-bottom:1px solid #000;padding:3px 7px;font-weight:900;">MODEL :- ${d.model}</div>
<div style="display:flex;border-bottom:1px solid #000;"><div style="flex:0 0 38%;padding:3px 7px;font-weight:900;border-right:1px solid #000;">CASH RECIVED :-</div><div style="flex:1;padding:3px 7px;">${cash?fmt(cash)+' /-  ( CASH )':''}</div></div>
<div style="display:flex;"><div style="flex:0.55;padding:3px 7px;border-right:1px solid #000;font-size:8pt;">AMOUNT IN WORDS :- <b>${d.words?d.words+' /-':''}</b></div><div style="flex:0.45;padding:3px 7px;text-align:center;font-weight:900;font-size:8pt;">FOR ${org.name}</div></div>
</div>`;

      const quotHTML = `<div style="border-top:2px dashed #999;margin:8px 0 5px;"></div>
${smHdr}
<div style="font-size:13pt;font-weight:900;text-align:center;text-decoration:underline;letter-spacing:2px;margin:4px 0;">QUOTATION</div>
<div style="border:2px solid #000;font-size:8.5pt;">
<div style="display:flex;border-bottom:1px solid #000;"><div style="flex:1;padding:3px 7px;border-right:1px solid #000;">NAME :- <b>${d.name}</b></div><div style="flex:0 0 42%;padding:3px 7px;font-weight:900;text-align:right;">QUOTATION NO &nbsp;${d.invno}</div></div>
<div style="display:flex;border-bottom:1px solid #000;"><div style="flex:1;padding:3px 7px;border-right:1px solid #000;font-size:7.5pt;">ADD:- ${d.address}</div><div style="flex:0 0 42%;padding:3px 7px;">DATE :- &nbsp;${fd(d.date)}</div></div>
<div style="display:flex;border-bottom:1px solid #000;"><div style="flex:1;padding:3px 7px;border-right:1px solid #000;"></div><div style="flex:0 0 42%;padding:3px 7px;font-size:7.5pt;">HP:- ${d.hp}</div></div>
<div style="display:flex;border-bottom:1px solid #000;background:#f5f5f5;"><div style="flex:0.68;padding:3px 7px;font-weight:900;border-right:1px solid #000;">MODEL :- ${d.model}</div><div style="flex:0.32;padding:3px 7px;font-weight:900;text-align:right;">Amount</div></div>
${PR2('EX SHOWROOM',ex?'&#8377;'+fmt(ex):'')}
${PR2('RTO',rto?'&#8377;'+fmt(rto):'')}
${PR2('INSURANCE',ins?'&#8377;'+fmt(ins):'')}
${PR2('HP',hp?'&#8377;'+fmt(hp):'')}
${PR2('ACCESSORIES',acc?'&#8377;'+fmt(acc):'')}
<div style="display:flex;border-bottom:1px solid #000;background:#fafafa;"><div style="flex:0.68;padding:3px 7px;font-weight:900;border-right:1px solid #000;font-size:8pt;">ON ROAD:- ${totW}</div><div style="flex:0.32;padding:3px 7px;font-weight:900;text-align:right;">${tot?fmt(tot):''}</div></div>
<div style="padding:3px 7px;border-bottom:1px solid #000;font-size:7pt;">GST NO :- ${org.gst}</div>
<div style="padding:3px 7px;font-size:7pt;">NEFT DETAIL :- ${org.bank} &nbsp; A/C NO:- ${org.neft}</div>
</div>
<div style="display:flex;justify-content:space-between;margin-top:5px;">
<div style="flex:1;font-size:5.5pt;line-height:1.5;color:#444;padding-right:8px;">I/We hereby certify that my/our registration certificate under the Maharashtra Value Added Tax Act,2002 is in force on the date on which the sale of the goods specified in this Tax Invoice is made by me/us.</div>
<div style="text-align:center;min-width:70px;font-size:7pt;font-weight:900;">${org.name}</div>
</div>`;

      // page1: auto-height (no min-height) so canvas crops to content
      // page2: full A4 min-height for invoice
      const page1Html = `<div style="width:210mm;min-height:297mm;padding:8mm 13mm;font-family:Arial,sans-serif;color:#000;background:#fff;box-sizing:border-box;">${recHTML}${quotHTML}</div>`;
      const page2Html = `<div style="width:210mm;min-height:297mm;padding:12mm 13mm;font-family:Arial,sans-serif;color:#000;background:#fff;box-sizing:border-box;">${tplI(d, org, hdr2, ft2)}</div>`;

      spin('Building 2-page PDF…');

      // Create two separate off-screen containers appended to body
      function mkContainer(html) {
        const el = document.createElement('div');
        el.style.cssText = 'position:absolute;left:-9999px;top:0;width:210mm;background:#fff;';
        el.innerHTML = html;
        document.body.appendChild(el);
        return el;
      }

      const c1 = mkContainer(page1Html);
      const c2 = mkContainer(page2Html);

      const H2COPTS = { scale:2, useCORS:true, allowTaint:true, logging:false, backgroundColor:'#ffffff' };

      try {
        // Render page 1 to canvas
        const canvas1 = await html2canvas(c1.firstChild, H2COPTS);
        const canvas2 = await html2canvas(c2.firstChild, H2COPTS);

        document.body.removeChild(c1);
        document.body.removeChild(c2);

        // Build PDF manually using jsPDF
        const { jsPDF } = window.jspdf;
        const pdf = new jsPDF({ unit:'mm', format:'a4', orientation:'portrait' });

        const W = 210, H = 297;
        // For each canvas: always fill the full A4 page (stretch to 210×297mm)
        const addCanvasToPdf = (pdf, canvas, isFirst) => {
          if (!isFirst) pdf.addPage();
          const imgData = canvas.toDataURL('image/jpeg', 0.97);
          // Always fill complete A4 page — no white gap at bottom
          pdf.addImage(imgData, 'JPEG', 0, 0, W, H);
        };

        addCanvasToPdf(pdf, canvas1, true);
        addCanvasToPdf(pdf, canvas2, false);
        pdf.save(`all-${nt}-plain.pdf`);

        unspin();
        saveCust(false);
        toast('All 3 docs downloaded ✓ (2 pages)');
      } catch (e) {
        if (document.body.contains(c1)) document.body.removeChild(c1);
        if (document.body.contains(c2)) document.body.removeChild(c2);
        unspin();
        toast('PDF error — try again', 'error'); console.error(e);
      }
    }

    // ══ OSV OFFICER ══
    // ── INIT ──
    initFb();
    const { watch, nextTick } = Vue;
    // When docs tab is opened, init all sig pads
    watch(tab, async (newTab) => {
      if (newTab === 'docs') {
        await nextTick();
        initSigPad('sig-cust', 'custSign');
        // RP uses shared custSign
        // TC uses shared custSign
        // Auto-fill names from customer form
        docsState.tcCustName = f.name || docsState.tcCustName;
        if (!docsState.tcLeadId) docsState.tcLeadId = f.invno || '';
      }
    });
    // Load officer details after auth
    document.addEventListener('click', e => {
      if (!e.target.closest('.ac-wrap')) {
        acDocno.value = false; acHp.value = false; acModel.value = false;
        acIdv.value = false;
      }
    });

    return {
      orgs, customers, curCustId, editOrgId, tab, tabs, sideOpen,
      f, qApprox, qv,
      orgModal, om,
      tMsg, tShow, tType, spinning, spinMsg,
      fbSyncing, fbMsg, fbMsgCls, saveStatus,
      acDocno, acHp, acModel, acIdv,
      dnoSug, dnoStatus, hpSug, modelSug, idvSug,
      uModels, currentOrg, rtoPct, idvPct, mData,
      onroadSuggestions,
      authUser, authChecked, authError,
      sideSearch, filteredCustomers,
      confirmDeleteId, confirmDeleteName,
      // methods
      newCustomer, clearForm, loadCustomer, deleteCust, saveCust, touchDate,
      onOrgChange, openOrgModal, editOrg, deleteOrg, prevStamp, saveOrg,
      onHpInput, onHpFocus,
      onModelInput, onModelFocus, selectModel,
      onIdvChange, onIdvFocus,
      applySuggestion,
      calc, autoCash,
      quotCalc, quotRandom, applyQuot,
      genSingle, genAllPlain, manualSync,
      signInGoogle, signOut,
      confirmDeleteCust, doDeleteCust,
      fmt, fd, st:setTimeout.bind(window),
    };
  }
}).mount('#app');
</script>
</body>
</html>
